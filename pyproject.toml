[project]
name = "x-mcp-server"
version = "0.1.0"
description = "An MCP server that scrapes X (formerly Twitter) using a stealth Patchright browser, exposed over FastMCP."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "afikrim" }]
keywords = ["mcp", "model-context-protocol", "x", "twitter", "scraping", "patchright", "fastmcp"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastmcp>=2.3.0",
    "patchright>=1.49.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.urls]
Homepage = "https://github.com/afikrim/x-mcp-server"
Repository = "https://github.com/afikrim/x-mcp-server"
Issues = "https://github.com/afikrim/x-mcp-server/issues"

[project.scripts]
x-mcp-server = "x_mcp_server.__main__:main"

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["x_mcp_server"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
